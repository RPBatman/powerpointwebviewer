<!DOCTYPE html>
<html>
<head>
  <title>Website Viewer</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%; height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden;
      background: linear-gradient(135deg, #4a90d9, #2c6cb0);
      padding: 10px;
    }

    /* Control bar */
    #config {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #config.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    #config .icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    #urlInput {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }

    #urlInput:focus {
      border-color: #4a90d9;
    }

    #urlInput::placeholder {
      color: #aaa;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: #4a90d9;
      color: white;
    }
    .btn-primary:hover { background: #3a7bc8; }

    .btn-window {
      background: #27ae60;
      color: white;
      padding: 8px 12px;
    }
    .btn-window:hover { background: #219a52; }

    .btn-hide {
      background: #e8e8e8;
      color: #555;
      padding: 8px 10px;
    }
    .btn-hide:hover { background: #ddd; }

    .btn-icon {
      background: #e8e8e8;
      color: #555;
      padding: 8px 11px;
      font-size: 15px;
      line-height: 1;
    }
    .btn-icon:hover { background: #ddd; }

    /* Toggle button (when controls are hidden) */
    #toggleBtn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 101;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      font-size: 16px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #toggleBtn:hover { background: rgba(255,255,255,1); }
    #toggleBtn.visible { display: flex; }

    /* Environment badge */
    #envBadge {
      position: absolute;
      top: 58px;
      right: 12px;
      z-index: 100;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: opacity 0.3s ease;
    }
    #envBadge.online {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
    }
    #envBadge.desktop {
      background: #d4edda;
      color: #155724;
      border: 1px solid #28a745;
    }
    #envBadge.hidden { opacity: 0; pointer-events: none; }

    /* Inner wrapper - white area inside the blue grab border */
    #appWrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #f0f2f5;
      border-radius: 4px;
      overflow: hidden;
    }

    /* iframe */
    #webFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    /* Error / status overlay */
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      z-index: 50;
      text-align: center;
      padding: 2em;
    }

    #overlay.hidden { display: none; }

    #overlay .emoji { font-size: 48px; margin-bottom: 16px; }
    #overlay h2 { color: #333; font-size: 20px; margin-bottom: 8px; }
    #overlay p { color: #777; font-size: 14px; max-width: 460px; line-height: 1.5; }
    #overlay .overlay-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #overlay .overlay-btn:hover { background: #219a52; }
    #overlay .overlay-btn.secondary {
      background: #4a90d9;
      margin-left: 8px;
    }
    #overlay .overlay-btn.secondary:hover { background: #3a7bc8; }
    #overlay .tip {
      margin-top: 20px;
      padding: 12px 20px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      color: #856404;
      font-size: 12px;
      max-width: 460px;
    }

    /* Save status note */
    #saveNote {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 110;
      max-width: calc(100% - 24px);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #saveNote.visible { opacity: 1; }
    #saveNote.ok { background: #d4edda; color: #155724; border: 1px solid #28a745; }
    #saveNote.warn { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
    #saveNote.error { background: #f8d7da; color: #721c24; border: 1px solid #dc3545; }

    /* Loading spinner */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      display: none;
      text-align: center;
    }
    #loading.active { display: block; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    #loading .loading-text {
      font-size: 12px;
      color: #999;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
          onerror="window.officeJsLoadFailed = true"></script>
</head>
<body>
<div id="appWrapper">

  <!-- Control bar -->
  <div id="config">
    <span class="icon">🌐</span>
    <input id="urlInput" type="text" placeholder="Enter website URL (e.g. https://example.com)" />
    <button class="btn btn-primary" onclick="loadUrl()">Load</button>
    <button class="btn btn-icon" onclick="reloadFrame()" title="Reload page">↻</button>
    <button class="btn btn-icon" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    <button id="btnOpenWindow" class="btn btn-window" onclick="openInDialog()" title="Open in a separate window">Window</button>
    <button class="btn btn-hide" onclick="toggleControls()" title="Hide controls">✕</button>
  </div>

  <!-- Show controls button -->
  <button id="toggleBtn" onclick="toggleControls()" title="Show controls">⚙</button>

  <!-- Environment badge -->
  <div id="envBadge"></div>

  <!-- Welcome overlay -->
  <div id="overlay">
    <div class="emoji">🌐</div>
    <h2>Live Website Viewer</h2>
    <p>Enter a website URL above and click <strong>Load</strong> to display it inside this slide.</p>
    <p style="margin-top: 8px; font-size: 13px; color: #999;">💡 Tip: paste a YouTube or Vimeo link to embed a video.</p>
  </div>

  <!-- Loading indicator -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading website...</div>
  </div>

  <!-- Save status note -->
  <div id="saveNote" role="status" aria-live="polite"></div>

  <!-- Website frame (no src until a URL is loaded) -->
  <iframe id="webFrame"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write; accelerometer; gyroscope; web-share"
          allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-presentation allow-downloads allow-modals"></iframe>

</div><!-- /appWrapper -->

  <script>
    const urlInput = document.getElementById('urlInput');
    const webFrame = document.getElementById('webFrame');
    const overlay = document.getElementById('overlay');
    const loading = document.getElementById('loading');
    const config = document.getElementById('config');
    const toggleBtn = document.getElementById('toggleBtn');
    const envBadge = document.getElementById('envBadge');
    const appWrapper = document.getElementById('appWrapper');
    const saveNote = document.getElementById('saveNote');

    // Keep in sync with <Version> and the ?v= query in manifest.xml
    const VIEWER_VERSION = '1.4.0.0';
    const SETTINGS_KEY = 'webViewerUrl';
    const OFFICE_READY_TIMEOUT_MS = 15000;

    let controlsVisible = true;
    let isOnline = false;        // true if running in PowerPoint Online
    let officeReady = false;
    let currentUrl = '';
    let loadTimeoutId = null;
    let iframeLoadFailed = false;
    let saveNoteTimeoutId = null;
    let officeHost = null;       // e.g. Office.HostType.PowerPoint; null when standalone
    let pendingSaveUrl = null;   // URL loaded before Office.js was ready
    let officeReadyWatchdogId = null;

    // ─── Detect environment ───────────────────────────────
    function detectEnvironment(info) {
      envBadge.title = 'Live Website Viewer v' + VIEWER_VERSION;
      try {
        if (!info || !info.host) throw new Error('Not running inside Office');
        // Office.context.platform: 'OfficeOnline', 'PC', 'Mac', 'iOS', 'Android'
        const platform = Office.context.platform;
        if (platform === Office.PlatformType.OfficeOnline) {
          isOnline = true;
          envBadge.textContent = 'POWERPOINT ONLINE';
          envBadge.className = 'online';
        } else {
          isOnline = false;
          envBadge.textContent = 'DESKTOP';
          envBadge.className = 'desktop';
        }
      } catch (e) {
        // If Office API not available, assume standalone/testing
        envBadge.textContent = 'STANDALONE';
        envBadge.className = 'desktop';
      }
    }

    // ─── Normalize URL ────────────────────────────────────
    function normalizeUrl(url) {
      url = url.trim();
      if (!url) return '';
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      return url;
    }

    // ─── Validate URL ─────────────────────────────────────
    function isValidUrl(str) {
      try {
        new URL(str);
        return true;
      } catch {
        return false;
      }
    }

    // ─── Convert YouTube / Vimeo links to embeddable URLs ─
    // Regular video pages (youtube.com/watch, youtu.be, vimeo.com/ID)
    // block iframe embedding. Their /embed/ player URLs do not.
    function toEmbedUrl(url) {
      try {
        var u = new URL(url);
        var host = u.hostname.replace(/^www\./i, '').toLowerCase();

        // ─── YouTube ───
        if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtube-nocookie.com') {
          if (u.pathname.indexOf('/embed/') === 0) return url; // already embeddable
          var videoId = u.searchParams.get('v');
          var shortMatch = u.pathname.match(/^\/(?:shorts|live)\/([A-Za-z0-9_-]+)/);
          if (shortMatch) videoId = shortMatch[1];
          var listId = u.searchParams.get('list');
          var startAt = parseInt(u.searchParams.get('t') || u.searchParams.get('start'), 10);
          if (videoId) {
            var params = [];
            if (!isNaN(startAt) && startAt > 0) params.push('start=' + startAt);
            if (listId) params.push('list=' + listId);
            return 'https://www.youtube.com/embed/' + videoId +
                   (params.length ? '?' + params.join('&') : '');
          }
          if (listId && u.pathname.indexOf('/playlist') === 0) {
            return 'https://www.youtube.com/embed/videoseries?list=' + listId;
          }
          return url;
        }

        // ─── YouTube short links (youtu.be) ───
        if (host === 'youtu.be') {
          var id = u.pathname.split('/').filter(Boolean)[0];
          if (id) {
            var t = parseInt(u.searchParams.get('t'), 10);
            return 'https://www.youtube.com/embed/' + id +
                   (!isNaN(t) && t > 0 ? '?start=' + t : '');
          }
          return url;
        }

        // ─── Vimeo ───
        if (host === 'vimeo.com') {
          if (u.pathname.indexOf('/video/') !== -1) return url; // already embeddable
          var segments = u.pathname.split('/').filter(Boolean);
          for (var i = segments.length - 1; i >= 0; i--) {
            if (/^\d+$/.test(segments[i])) {
              return 'https://player.vimeo.com/video/' + segments[i];
            }
          }
        }
      } catch (e) {
        // Not a parseable URL — leave it unchanged
      }
      return url;
    }

    // ─── Escape text for use in innerHTML ─────────────────
    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    // ─── Show error in overlay ────────────────────────────
    function showError(title, message, showButtons) {
      overlay.classList.remove('hidden');
      let html = '<div class="emoji">⚠️</div>';
      html += '<h2>' + title + '</h2>';
      html += '<p>' + message + '</p>';

      if (showButtons && currentUrl) {
        html += '<div style="margin-top: 16px;">';
        html += '<button class="overlay-btn" onclick="openInDialog()">Open in Window</button>';
        html += '<button class="overlay-btn secondary" onclick="retryLoad()">Retry in Frame</button>';
        html += '</div>';
        if (isOnline) {
          html += '<div class="tip"><strong>Tip:</strong> In PowerPoint Online, many websites block being embedded in frames. Use <strong>"Open in Window"</strong> to view the site in a separate browser window, or try <strong>"Window"</strong> button in the toolbar.</div>';
        }
      }

      overlay.innerHTML = html;
      loading.classList.remove('active');
    }

    // ─── Show a fatal startup error with a Reload button ──
    function showFatalError(title, message) {
      clearTimeout(loadTimeoutId);
      loading.classList.remove('active');
      overlay.classList.remove('hidden');
      overlay.innerHTML =
        '<div class="emoji">⚠️</div>' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(message) + '</p>' +
        '<div style="margin-top: 16px;"><button class="overlay-btn secondary" onclick="location.reload()">Reload</button></div>';
    }

    // ─── Show the small save-status note ──────────────────
    function showSaveNote(text, kind, sticky) {
      clearTimeout(saveNoteTimeoutId);
      saveNote.textContent = text;
      saveNote.className = kind + ' visible';
      if (!sticky) {
        saveNoteTimeoutId = setTimeout(function () {
          saveNote.classList.remove('visible');
        }, 6000);
      }
    }

    // ─── Show welcome screen ──────────────────────────────
    function showWelcome() {
      overlay.classList.remove('hidden');
      let html = '<div class="emoji">🌐</div>';
      html += '<h2>Live Website Viewer</h2>';
      html += '<p>Enter a website URL above and click <strong>Load</strong> to display it inside this slide.</p>';
      html += '<p style="margin-top: 8px; font-size: 13px; color: #999;">💡 Tip: paste a YouTube or Vimeo link to embed a video.</p>';

      if (isOnline) {
        html += '<div class="tip" style="margin-top: 16px;"><strong>PowerPoint Online detected:</strong> Some websites may not display inside the frame. If a site does not load, use the <strong>"Window"</strong> button to open it in a separate browser window.</div>';
      }

      overlay.innerHTML = html;
    }

    // ─── Show / hide controls ─────────────────────────────
    function setControlsVisible(visible) {
      controlsVisible = visible;
      if (visible) {
        config.classList.remove('hidden');
        toggleBtn.classList.remove('visible');
        envBadge.classList.remove('hidden');
      } else {
        config.classList.add('hidden');
        toggleBtn.classList.add('visible');
        envBadge.classList.add('hidden');
      }
    }

    function toggleControls() {
      setControlsVisible(!controlsVisible);
    }

    // ─── Reload the current page ──────────────────────────
    function reloadFrame() {
      if (!currentUrl) {
        showWelcome();
        return;
      }
      overlay.classList.add('hidden');
      loading.classList.add('active');
      iframeLoadFailed = false;
      webFrame.src = currentUrl;
      startLoadTimeout();
    }

    // ─── Fullscreen toggle ────────────────────────────────
    function toggleFullscreen() {
      var fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsElement) {
        var exitFs = document.exitFullscreen || document.webkitExitFullscreen;
        if (exitFs) exitFs.call(document);
        return;
      }
      var requestFs = appWrapper.requestFullscreen || appWrapper.webkitRequestFullscreen;
      if (requestFs) {
        try {
          var result = requestFs.call(appWrapper);
          if (result && typeof result.catch === 'function') {
            // Fullscreen blocked (common inside Office) — fall back to a clean view
            result.catch(function () { setControlsVisible(false); });
          }
        } catch (e) {
          setControlsVisible(false);
        }
      } else {
        setControlsVisible(false);
      }
    }

    function onFullscreenChange() {
      var active = !!(document.fullscreenElement || document.webkitFullscreenElement);
      setControlsVisible(!active);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    // ─── Open URL using Office Dialog API ─────────────────
    function openInDialog() {
      let url = currentUrl || normalizeUrl(urlInput.value);
      if (!url) {
        showError('Empty URL', 'Please enter a website URL first.', false);
        return;
      }

      // Try Office Dialog API first (works great in Online)
      try {
        if (officeReady && Office.context.ui) {
          Office.context.ui.displayDialogAsync(url, {
            width: 80,
            height: 80,
            promptBeforeOpen: false
          }, function (result) {
            if (result.status === Office.AsyncResultStatus.Failed) {
              // Fallback: open in new tab
              window.open(url, '_blank');
            }
          });
          return;
        }
      } catch (e) {
        console.log('Dialog API not available:', e);
      }

      // Fallback: open in new tab
      window.open(url, '_blank');
    }

    // ─── Retry loading in iframe ──────────────────────────
    function retryLoad() {
      if (currentUrl) {
        overlay.classList.add('hidden');
        loading.classList.add('active');
        iframeLoadFailed = false;
        webFrame.src = currentUrl;
        startLoadTimeout();
      }
    }

    // ─── Load timeout detection ───────────────────────────
    function startLoadTimeout() {
      clearTimeout(loadTimeoutId);
      iframeLoadFailed = false;

      loadTimeoutId = setTimeout(function () {
        // If loading indicator is still active after timeout, iframe probably failed
        if (loading.classList.contains('active')) {
          iframeLoadFailed = true;
          showError(
            'Website did not load',
            'The website is taking too long or may be blocking embedded display.' +
            (isOnline ? ' This is common in PowerPoint Online.' : ''),
            true
          );
        }
      }, isOnline ? 12000 : 15000); // Shorter timeout for Online since it's more likely to fail
    }

    // ─── Save URL to Office settings ──────────────────────
    // settings.saveAsync only writes the URL into the open presentation;
    // it is lost unless the .pptx itself is saved afterwards.
    function saveUrl(url) {
      if (!officeReady) {
        pendingSaveUrl = url;  // saved once Office.onReady fires
        return;
      }
      if (!officeHost) {
        showSaveNote('Not running inside PowerPoint — URL not saved.', 'warn');
        return;
      }
      try {
        var settings = Office.context.document.settings;
        settings.set(SETTINGS_KEY, url);
        settings.saveAsync(function (result) {
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            showSaveNote(isOnline
              ? 'Saved — stored with this presentation.'
              : 'Saved — remember to save the file (Ctrl+S).', 'ok');
          } else {
            var reason = result.error ? result.error.message : 'unknown error';
            showSaveNote('URL not saved: ' + reason, 'error', true);
          }
        });
      } catch (e) {
        showSaveNote('URL not saved: ' + e.message, 'error', true);
      }
    }

    // ─── Load URL into iframe ─────────────────────────────
    function loadUrl() {
      let typedUrl = normalizeUrl(urlInput.value);

      if (!typedUrl) {
        showError('Empty URL', 'Please enter a website URL to load.', false);
        return;
      }

      if (!isValidUrl(typedUrl)) {
        showError('Invalid URL', 'The URL you entered is not valid. Please check it and try again.', false);
        return;
      }

      // Show the normalized URL the user typed
      urlInput.value = typedUrl;

      // Convert YouTube / Vimeo links to their embeddable player URL
      currentUrl = toEmbedUrl(typedUrl);

      // Show loading
      overlay.classList.add('hidden');
      loading.classList.add('active');
      iframeLoadFailed = false;

      // Set iframe src
      webFrame.src = currentUrl;

      // Start load timeout detection
      startLoadTimeout();

      // Save the URL the user typed (re-converted when reloaded)
      saveUrl(typedUrl);
    }

    // ─── Handle iframe load events ────────────────────────
    webFrame.addEventListener('load', function () {
      if (!currentUrl) return;  // initial about:blank, not a user URL
      clearTimeout(loadTimeoutId);
      loading.classList.remove('active');

      if (webFrame.src && webFrame.src !== 'about:blank' && webFrame.src !== '') {
        // Check if iframe actually loaded content (blank page detection)
        try {
          // Try to access iframe document - if blocked by CORS, it loaded something
          var doc = webFrame.contentDocument;
          if (doc && doc.body) {
            var bodyContent = doc.body.innerHTML;
            // If body is completely empty, the site might have blocked loading
            if (!bodyContent || bodyContent.trim() === '') {
              showError(
                'Website appears blank',
                'The website loaded but shows no content. It may be blocking embedded display.',
                true
              );
              return;
            }
          }
        } catch (e) {
          // CORS error = the site actually loaded (different origin)
          // This is the GOOD case - site loaded from a different domain
        }
        overlay.classList.add('hidden');
      }
    });

    // ─── Handle iframe errors ─────────────────────────────
    webFrame.addEventListener('error', function () {
      clearTimeout(loadTimeoutId);
      loading.classList.remove('active');
      iframeLoadFailed = true;
      showError(
        'Could not load website',
        'This website may block being embedded in frames, or there may be a connection issue.',
        true
      );
    });

    // ─── Enter key to load ────────────────────────────────
    urlInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        loadUrl();
      }
    });

    // ─── Restore this slide's saved URL ───────────────────
    // Returns true if something other than the welcome screen is shown.
    function restoreSavedUrl() {
      if (!officeHost) return false;
      var savedUrl;
      try {
        savedUrl = Office.context.document.settings.get(SETTINGS_KEY);
      } catch (e) {
        showError('Could not read saved URL', escapeHtml(e.message), false);
        return true;
      }
      if (typeof savedUrl !== 'string' || !savedUrl.trim()) return false;

      urlInput.value = savedUrl;
      currentUrl = toEmbedUrl(savedUrl);
      overlay.classList.add('hidden');
      loading.classList.add('active');
      iframeLoadFailed = false;
      webFrame.src = currentUrl;
      startLoadTimeout();
      return true;
    }

    function onOfficeReady(info) {
      clearTimeout(officeReadyWatchdogId);
      officeReady = true;
      officeHost = (info && info.host) || null;

      detectEnvironment(info);

      if (pendingSaveUrl) {
        // User loaded a URL before Office was ready: keep it and save it
        var url = pendingSaveUrl;
        pendingSaveUrl = null;
        saveUrl(url);
      } else if (!restoreSavedUrl() && !currentUrl) {
        // Update welcome screen with environment-specific tips
        showWelcome();
      }
    }

    // ─── Initialize with Office.js ────────────────────────
    function initOffice() {
      if (window.officeJsLoadFailed || typeof Office === 'undefined' || typeof Office.onReady !== 'function') {
        detectEnvironment(null);
        showFatalError(
          'Office.js failed to load',
          'The Office JavaScript library (appsforoffice.microsoft.com) could not be downloaded, ' +
          'so this slide cannot restore or save its URL. Check your internet connection, proxy or firewall, then click Reload.'
        );
        return;
      }

      officeReadyWatchdogId = setTimeout(function () {
        if (!officeReady) {
          showFatalError(
            'PowerPoint did not respond',
            'Office.js loaded, but PowerPoint never finished starting the add-in. ' +
            'Click Reload, or close and reopen the presentation.'
          );
        }
      }, OFFICE_READY_TIMEOUT_MS);

      Office.onReady().then(onOfficeReady, function (e) {
        clearTimeout(officeReadyWatchdogId);
        showFatalError('Office.js failed to initialize', (e && e.message) || String(e));
      });
    }

    initOffice();
  </script>
</body>
</html>
